# EmiBSD lab network (isolated switch: Mac 10.77.0.1, Raspberry Pi 4 10.77.0.2, PC by DHCP).
# DHCP + TFTP on the hub's Ethernet (en6) only; never on Wi-Fi.
interface=en6
bind-interfaces
port=0
user=enavarre
group=staff
log-dhcp
log-facility=/Users/enavarre/devel/EmiBSD.LZ/target/lab-dnsmasq.log
dhcp-authoritative
dhcp-range=10.77.0.100,10.77.0.150,255.255.255.0,1h
dhcp-host=dc:a6:32:f9:12:c0,10.77.0.2,rpi4
# No router, no DNS on this network.
dhcp-option=3
dhcp-option=6
# UEFI PXE: client-arch 11 = arm64, 7/9 = x86-64.
dhcp-match=set:efi-arm64,option:client-arch,11
dhcp-match=set:efi-x64,option:client-arch,7
dhcp-match=set:efi-x64,option:client-arch,9
dhcp-boot=tag:efi-arm64,arm64/BOOTAA64.EFI,,10.77.0.1
dhcp-boot=tag:efi-x64,amd64/BOOTX64.EFI,,10.77.0.1
# TFTP is served by macOS tftpd (/private/tftpboot): dnsmasq 2.93 on macOS sometimes sends a
# routing-socket message (rt_msghdr, RTM_MISS) in place of a TFTP data block.
# enable-tftp
# tftp-root is not used: TFTP is macOS tftpd (org.emibsd.lab.tftpd.plist)
